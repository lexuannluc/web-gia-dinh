<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Button Contact VR – Zalo & Gọi điện</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #f0f0f0;
      font-family: sans-serif;
    }

    .demo-label {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 8px 22px;
      border-radius: 30px;
      font-size: 13px;
      z-index: 9999;
      white-space: nowrap;
    }

    /* ============================================================
       COPY NGUYÊN XI TỪ PLUGIN style.css
       ============================================================ */

  #button-contact-vr{
    position:fixed !important;
    right:20px !important;
    left:auto !important;
    bottom:50px !important;
    z-index:99999;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
}

    #button-contact-vr .button-contact {
      position: relative;
      margin-top: -5px;
    }

    #button-contact-vr .button-contact .phone-vr {
      position: relative;
      visibility: visible;
      background-color: transparent;
      width: 90px;
      height: 90px;
      cursor: pointer;
      z-index: 11;
      backface-visibility: hidden;
      transform: translateZ(0);
      -webkit-backface-visibility: hidden;
      -webkit-transform: translateZ(0);
      transition: visibility .5s;
      left: 0;
      bottom: 0;
      display: block;
    }

    /* Vòng sóng lan — plugin ghi đè animation cuối = zoom 1.3s */
    .phone-vr-circle-fill {
      width: 65px;
      height: 65px;
      top: 12px;
      left: 12px;
      position: absolute;
      box-shadow: 0 0 0 0 #c31d1d;
      background-color: rgba(230, 8, 8, 0.7);
      border-radius: 50%;
      border: 2px solid transparent;
      -webkit-animation: phone-vr-circle-fill 2.3s infinite ease-in-out;
      animation: zoom 1.3s infinite;   /* ← plugin override: chỉ zoom chạy */
      transition: all .5s;
      -webkit-transform-origin: 50% 50%;
      -ms-transform-origin: 50% 50%;
      transform-origin: 50% 50%;
    }

    /* Vòng icon — rung lắc 1s */
    .phone-vr-img-circle {
      background-color: #e60808;
      width: 40px;
      height: 40px;
      line-height: 40px;
      top: 25px;
      left: 25px;
      position: absolute;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-animation: phonering-alo-circle-img-anim 1s infinite ease-in-out;
      animation: phone-vr-circle-fill 1s infinite ease-in-out;
    }

    .phone-vr-img-circle a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      line-height: 37px;
    }

    .phone-vr-img-circle img,
    .phone-vr-img-circle svg {
      max-height: 75px;
      max-width: 75px;
      position: absolute;
      top: 50%;
      left: 50%;
      object-fit:contain;
      top: 1px;
      transform: translate(-50%, -50%);
    }

    /* ZALO */
    #zalo-vr .phone-vr-circle-fill {
      box-shadow: 0 0 0 0 #2196F3;
      background-color: rgba(33, 150, 243, 0.7);
    }
    #zalo-vr .phone-vr-img-circle {
      background-color: #2196F3;
    }

    /* ĐIỆN THOẠI */
    #phone-vr .phone-vr-circle-fill {
      box-shadow: 0 0 0 0 #c31d1d;
      background-color: rgba(230, 8, 8, 0.7);
    }
    #phone-vr .phone-vr-img-circle {
      background-color: #e60808;
    }

    /* ── KEYFRAMES (copy 100% từ plugin) ── */

    @-webkit-keyframes phone-vr-circle-fill {
      0%   { -webkit-transform: rotate(0deg)   scale(1) skew(1deg); }
      10%  { -webkit-transform: rotate(-25deg) scale(1) skew(1deg); }
      20%  { -webkit-transform: rotate(25deg)  scale(1) skew(1deg); }
      30%  { -webkit-transform: rotate(-25deg) scale(1) skew(1deg); }
      40%  { -webkit-transform: rotate(25deg)  scale(1) skew(1deg); }
      50%  { -webkit-transform: rotate(0deg)   scale(1) skew(1deg); }
      100% { -webkit-transform: rotate(0deg)   scale(1) skew(1deg); }
    }
    @keyframes phone-vr-circle-fill {
      0%   { transform: rotate(0deg)   scale(1) skew(1deg); }
      10%  { transform: rotate(-25deg) scale(1) skew(1deg); }
      20%  { transform: rotate(25deg)  scale(1) skew(1deg); }
      30%  { transform: rotate(-25deg) scale(1) skew(1deg); }
      40%  { transform: rotate(25deg)  scale(1) skew(1deg); }
      50%  { transform: rotate(0deg)   scale(1) skew(1deg); }
      100% { transform: rotate(0deg)   scale(1) skew(1deg); }
    }

    @-webkit-keyframes zoom {
      0%   { transform: scale(.9); }
      70%  { transform: scale(1);  box-shadow: 0 0 0 15px transparent; }
      100% { transform: scale(.9); box-shadow: 0 0 0 0  transparent; }
    }
    @keyframes zoom {
      0%   { transform: scale(.9); }
      70%  { transform: scale(1);  box-shadow: 0 0 0 15px transparent; }
      100% { transform: scale(.9); box-shadow: 0 0 0 0  transparent; }
    }
  </style>
</head>
<body>

  <div class="demo-label">Demo – hai nút góc trái dưới (đúng vị trí plugin)</div>

  <div id="button-contact-vr">

    <!-- NÚT ZALO -->
    <div id="zalo-vr" class="button-contact">
      <div class="phone-vr">
        <div class="phone-vr-circle-fill"></div>
        <div class="phone-vr-img-circle">
          <a href="https://zalo.me/0123456789" target="_blank" title="Chat Zalo">
            <img src="../img/icon zalo.png" alt="Zalo" >
          </a>
        </div>
      </div>
    </div>

    <!-- NÚT GỌI ĐIỆN -->
    <div id="phone-vr" class="button-contact">
      <div class="phone-vr">
        <div class="phone-vr-circle-fill"></div>
        <div class="phone-vr-img-circle">
          <a href="tel:0123456789" title="Gọi điện ngay">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 width="22" height="22" fill="white"
                 style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
              <path d="M6.62 10.79a15.053 15.053 0 0 0 6.59 6.59l2.2-2.2
                       a1 1 0 0 1 1.01-.24c1.12.37 2.33.57 3.58.57
                       a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.01 21 3 13.99 3 5
                       a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.58
                       a1 1 0 0 1-.25 1.01l-2.2 2.2z"/>
            </svg>
          </a>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
